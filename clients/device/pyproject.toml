[project]
name = "factotum-device"
version = "0.0.0"
description = "The Factotum device application: a speaker with a microphone that connects to the edge, hears a person by a key or a wake word, and says the answer as it arrives."
requires-python = ">=3.13"
dependencies = [
  "factotum-client-audio",
  "factotum-client-core",
  "factotum-contracts",
  "pydantic>=2.11",
  "pyyaml>=6.0",
]

[project.scripts]
factotum-device = "factotum.device.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factotum"]

[tool.uv.sources]
factotum-client-audio = { workspace = true }
factotum-client-core = { workspace = true }
factotum-contracts = { workspace = true }

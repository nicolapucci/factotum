# Optional: `uv run pre-commit install --hook-type pre-commit --hook-type pre-push`
# Runs the same checks as CI before each commit, and the unit tests before each push.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false

      - id: unit-tests
        name: unit tests
        entry: uv run pytest -q -m "not integration and not live"
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

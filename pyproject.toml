[project]
name = "factotum"
version = "0.0.0"
description = "Self-hosted voice assistant that answers from your own documents and the web, using the models you choose."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[tool.uv]
# The root only hosts the workspace and the shared tooling; it is not a package.
package = false

[tool.uv.workspace]
members = ["libs/*", "services/*", "clients/*", "e2e"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = [
  "libs/contracts/src",
  "libs/common/src",
  "libs/devices/src",
  "libs/web/src",
  "libs/db/src",
  "libs/model_client/src",
  "services/model_gateway/src",
  "services/knowledge/src",
  "services/conversation/src",
  "services/actions/src",
  "services/edge/src",
  "services/egress/src",
  "services/runner/src",
  "services/hub/src",
  "clients/terminal/src",
  "e2e/src",
]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "N",        # pep8-naming
  "UP",       # pyupgrade
  "B",        # bugbear
  "C4",       # comprehensions
  "SIM",      # simplify
  "RUF",      # ruff-specific
  "PT",       # pytest style
  "ASYNC",    # async pitfalls
  "S",        # security (bandit)
  "DTZ",       # naive datetimes: every timestamp must carry a time zone
  "BLE",       # blind excepts
  "PIE", "PERF", "T20",
]

[tool.ruff.lint.per-file-ignores]
# Asserts and obviously fake secrets are expected in tests.
"**/tests/**" = ["S101", "S105", "S106"]
# The rig of the end-to-end tests is test code that tests share: it asserts too.
"e2e/src/**" = ["S101"]
# A live test reports what it measured: it is run by a person, with -s, to read it.
"**/tests/live/**" = ["T201"]
# A skill script talks to the standard streams (its protocol) and to hosts it declared.
"skills/**" = ["T201", "S310"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = [
  "libs/contracts/src",
  "libs/common/src",
  "libs/devices/src",
  "libs/web/src",
  "libs/db/src",
  "libs/model_client/src",
  "services/model_gateway/src",
  "services/knowledge/src",
  "services/conversation/src",
  "services/actions/src",
  "services/edge/src",
  "services/egress/src",
  "services/runner/src",
  "services/hub/src",
  "clients/terminal/src",
  "e2e/src",
]
explicit_package_bases = true
namespace_packages = true
files = ["libs", "services", "clients", "e2e"]

[[tool.mypy.overrides]]
module = [
  "langdetect",
  "langdetect.*",
  "reportlab",
  "reportlab.*",
  "faster_whisper",
  "faster_whisper.*",
  "pvporcupine",
  "sounddevice",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["libs", "services", "clients", "e2e"]
# Unit tests must never reach the network: only loopback connections are allowed.
addopts = "-ra --strict-markers --strict-config --import-mode=importlib --allow-hosts=127.0.0.1,::1"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
markers = [
  "integration: needs Docker services (deselect with -m 'not integration')",
  "live: runs real models or calls real providers, with your own keys or the models of this machine (opt-in, never runs in CI)",
]

[tool.coverage.run]
branch = true
source = [
  "libs/contracts/src",
  "libs/common/src",
  "libs/devices/src",
  "libs/web/src",
  "libs/db/src",
  "libs/model_client/src",
  "services/model_gateway/src",
  "services/knowledge/src",
  "services/conversation/src",
  "services/actions/src",
  "services/edge/src",
  "services/egress/src",
  "services/runner/src",
  "services/hub/src",
  "clients/terminal/src",
  "e2e/src",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
  # The guard of an entry point: what it calls is tested, the guard itself only runs for real.
  "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.31.3",
    "hypothesis>=6.168.0",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "pyyaml>=6.0.3",
    "reportlab>=5.0.1",
    "respx>=0.23.1",
    "ruff>=0.16.8",
    "types-jsonschema>=4.26.0.20260518",
    "types-pyyaml>=6.0.12.20260906",
]

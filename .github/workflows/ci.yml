name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit: a tag can be moved, a commit cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          enable-cache: true

      # --locked fails the build when pyproject.toml and uv.lock disagree.
      - name: Install
        run: uv sync --all-packages --locked

      - name: Ruff (lint)
        run: uv run ruff check

      - name: Ruff (format)
        run: uv run ruff format --check

      - name: Mypy
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest -m "not integration and not live" --cov --cov-report=term-missing

  compose:
    name: The compose file is valid and the images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate
        run: docker compose config --quiet
        env:
          FACTOTUM_POSTGRES_PASSWORD: ci-only

      - name: Build the model gateway image
        run: docker build -f services/model_gateway/Dockerfile -t factotum-model-gateway:ci .

      - name: Build the knowledge service image
        run: docker build -f services/knowledge/Dockerfile -t factotum-knowledge:ci .

      - name: Build the conversation service image
        run: docker build -f services/conversation/Dockerfile -t factotum-conversation:ci .

      - name: Build the edge image
        run: docker build -f services/edge/Dockerfile -t factotum-edge:ci .

      - name: Build the actions image
        run: docker build -f services/actions/Dockerfile -t factotum-actions:ci .

      - name: Build the egress proxy image
        run: docker build -f services/egress/Dockerfile -t factotum-egress:ci .

      - name: Build the runner image
        run: docker build -f services/runner/Dockerfile -t factotum-runner:ci .

  integration:
    name: Integration tests against Postgres with pgvector
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: factotum
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U factotum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FACTOTUM_POSTGRES_HOST: 127.0.0.1
      FACTOTUM_POSTGRES_PASSWORD: ci-only
      # A missing database is a failure here, never a silent skip.
      FACTOTUM_REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Install
        run: uv sync --all-packages --locked

      # The tests of the runner that need a real engine run scripts in the image that scripts run in,
      # which the runner never pulls: without it they skip.
      - name: Pull the image that scripts run in
        run: docker pull python:3.13-slim

      # The coverage floor belongs to the unit tests: these are a different slice of the suite.
      - name: Integration tests
        run: uv run pytest -m integration --no-cov

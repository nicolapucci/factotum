[project]
name = "factotum-e2e"
version = "0.0.0"
description = "The end-to-end tests of Factotum: every service put together in one process, from a device to the models. A package for what those tests share (the rig), since one test module cannot import another."
requires-python = ">=3.13"
dependencies = [
  "factotum-actions",
  "factotum-client-core",
  "factotum-common",
  "factotum-contracts",
  "factotum-conversation",
  "factotum-db",
  "factotum-devices",
  "factotum-edge",
  "factotum-hub",
  "factotum-knowledge",
  "factotum-model-client",
  "factotum-model-gateway",
  "factotum-terminal",
  "factotum-web",
  "asyncpg>=0.30",
  "fastapi>=0.115",
  "httpx>=0.28",
  "jsonschema>=4.23",
  "python-docx>=1.1",
  "reportlab>=5.0.1",
  "uvicorn>=0.32",
  "websockets>=15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factotum"]

[tool.uv.sources]
factotum-actions = { workspace = true }
factotum-client-core = { workspace = true }
factotum-common = { workspace = true }
factotum-contracts = { workspace = true }
factotum-conversation = { workspace = true }
factotum-db = { workspace = true }
factotum-devices = { workspace = true }
factotum-edge = { workspace = true }
factotum-hub = { workspace = true }
factotum-knowledge = { workspace = true }
factotum-model-client = { workspace = true }
factotum-model-gateway = { workspace = true }
factotum-terminal = { workspace = true }
factotum-web = { workspace = true }

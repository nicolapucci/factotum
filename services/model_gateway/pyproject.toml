[project]
name = "factotum-model-gateway"
version = "0.0.0"
description = "The Factotum model gateway: the only service that knows model providers, addresses and keys."
requires-python = ">=3.13"
dependencies = [
  "factotum-contracts",
  "factotum-common",
  "factotum-web",
  "fastapi>=0.115",
  "faster-whisper>=1.0",
  "httpx>=0.28",
  "jsonschema>=4.23",
  "piper-tts>=1.8",
  "pydantic>=2.11",
  "pyyaml>=6.0",
  "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factotum"]

[tool.uv.sources]
factotum-contracts = { workspace = true }
factotum-common = { workspace = true }
factotum-web = { workspace = true }

[project]
name = "factotum-knowledge"
version = "0.0.0"
description = "The Factotum knowledge service: documents in, passages out. Ingestion, chunking, embeddings through the gateway, hybrid search in Postgres with pgvector."
requires-python = ">=3.13"
dependencies = [
  "factotum-contracts",
  "factotum-common",
  "factotum-db",
  "factotum-web",
  "beautifulsoup4>=4.12",
  "fastapi>=0.115",
  "httpx>=0.28",
  "langdetect>=1.0.9",
  "markdown-it-py>=3.0",
  "pydantic>=2.11",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "python-multipart>=0.0.12",
  "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factotum"]

[tool.uv.sources]
factotum-contracts = { workspace = true }
factotum-common = { workspace = true }
factotum-db = { workspace = true }
factotum-web = { workspace = true }

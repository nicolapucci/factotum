[project]
name = "factotum-egress"
version = "0.0.0"
description = "The Factotum egress proxy: the only way out of the sandbox of a skill. It lets a run reach the hosts that its grant lists, and nothing else."
requires-python = ">=3.13"
dependencies = [
  "factotum-contracts",
  "factotum-common",
  "pydantic>=2.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factotum"]

[tool.uv.sources]
factotum-contracts = { workspace = true }
factotum-common = { workspace = true }

[project]
name = "factotum-runner"
version = "0.0.0"
description = "The Factotum runner: it runs the script of a skill in a container of its own, with the limits and the network that the job allows, and says what came of it."
requires-python = ">=3.13"
dependencies = [
  "factotum-contracts",
  "factotum-common",
  "factotum-web",
  "fastapi>=0.115",
  "httpx>=0.28",
  "pydantic>=2.11",
  "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factotum"]

[tool.uv.sources]
factotum-contracts = { workspace = true }
factotum-common = { workspace = true }
factotum-web = { workspace = true }

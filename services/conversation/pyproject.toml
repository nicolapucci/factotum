[project]
name = "factotum-conversation"
version = "0.0.0"
description = "The Factotum conversation service: a turn answers from the user's documents and carries no history, unless the message refers to an earlier exchange, which is looked up in a log of what was said."
requires-python = ">=3.13"
dependencies = [
  "factotum-contracts",
  "factotum-common",
  "factotum-db",
  "factotum-web",
  "factotum-model-client",
  "fastapi>=0.115",
  "httpx>=0.28",
  "pydantic>=2.11",
  "tzdata>=2024.1",
  "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factotum"]

[tool.uv.sources]
factotum-contracts = { workspace = true }
factotum-common = { workspace = true }
factotum-db = { workspace = true }
factotum-web = { workspace = true }
factotum-model-client = { workspace = true }

[project]
name = "factotum-devices"
version = "0.0.0"
description = "The interface for Factotum system devices: ready-made methods on top of the shared command vocabulary."
requires-python = ">=3.13"
dependencies = ["factotum-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factotum"]

[tool.uv.sources]
factotum-contracts = { workspace = true }

[project]
name = "factotum-db"
version = "0.0.0"
description = "Postgres for the Factotum services: settings, a pool whose transactions know their tenant, SQL migrations, and a harness for tests against a real database."
requires-python = ">=3.13"
dependencies = [
  "factotum-contracts",
  "factotum-common",
  "asyncpg>=0.30",
  "pydantic>=2.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factotum"]

[tool.uv.sources]
factotum-contracts = { workspace = true }
factotum-common = { workspace = true }

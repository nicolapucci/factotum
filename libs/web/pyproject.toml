[project]
name = "factotum-web"
version = "0.0.0"
description = "What the HTTP interfaces of the Factotum services share: typed errors as responses, authentication, limits."
requires-python = ">=3.13"
dependencies = [
  "factotum-contracts",
  "fastapi>=0.115",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factotum"]

[tool.uv.sources]
factotum-contracts = { workspace = true }

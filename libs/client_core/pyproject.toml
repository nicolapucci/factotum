[project]
name = "factotum-client-core"
version = "0.0.0"
description = "What every Factotum client shares: the protocol with the edge, what a person says sent as they say it, the sound of an answer played as it arrives, and the ports that the hardware of each device plugs into."
requires-python = ">=3.13"
dependencies = [
  "factotum-contracts",
  "pydantic>=2.11",
  "websockets>=15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factotum"]

[tool.uv.sources]
factotum-contracts = { workspace = true }

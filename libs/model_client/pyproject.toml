[project]
name = "factotum-model-client"
version = "0.0.0"
description = "How the Factotum services reach the model gateway: chat (whole or streamed), embeddings and the profile of a role, acting for an owner."
requires-python = ">=3.13"
dependencies = [
  "factotum-contracts",
  "factotum-common",
  "httpx>=0.28",
  "pydantic>=2.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factotum"]

[tool.uv.sources]
factotum-contracts = { workspace = true }
factotum-common = { workspace = true }

[project]
name = "factotum-common"
version = "0.0.0"
description = "Shared building blocks for the Factotum services: configuration, logging with redaction, authorization, guarded outbound HTTP."
requires-python = ">=3.13"
dependencies = [
  "factotum-contracts",
  "pydantic>=2.11",
  "pydantic-settings>=2.6",
  "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factotum"]

[tool.uv.sources]
factotum-contracts = { workspace = true }

[project]
name = "factotum-client-audio"
version = "0.0.0"
description = "The sound hardware that Factotum clients share: a microphone that a key or a wake word watches, a speaker that takes the voice of an answer as it arrives, and where a person's speech ends."
requires-python = ">=3.13"
dependencies = [
  "factotum-client-core",
  "factotum-contracts",
  "numpy>=1.26",
  "pvporcupine>=3.0",
  "sounddevice>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factotum"]

[tool.uv.sources]
factotum-client-core = { workspace = true }
factotum-contracts = { workspace = true }

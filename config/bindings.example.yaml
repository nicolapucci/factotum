# Model bindings for development: which model serves which role.
#
# Copy this file to config/bindings.dev.yaml (git ignores it), adjust it, and point the gateway at
# it with FACTOTUM_GATEWAY_BINDINGS_FILE=config/bindings.dev.yaml. The bindings belong to the
# development tenant; give an entry a `user: <id>` and it is that user's own instead.
#
# Keys are never written here. `secret_ref` names an environment variable that holds the key:
#   export OPENAI_API_KEY=sk-...
#
# `max_input_tokens` is what you allow the conversation to put in a prompt. It is yours to declare
# because model catalogues change too often to be hardcoded.

bindings:
  # Models on this machine, through Ollama.
  - role: chat.main
    provider: ollama
    model: llama3.1:8b-instruct-q4_K_M
    base_url: http://localhost:11434
    options:
      max_input_tokens: 8192
      num_ctx: 8704

  # chat.fast reads the message of anybody who has said something before, to tell whether it refers
  # to the past (docs/conversation.md): a small, quick model is what it is for. Ollama loads a model
  # for one window at a time, so a second model that does not fit in the memory of the graphics card
  # beside the first is loaded again for every message (a turn that takes a second takes fourteen),
  # and so is the same model bound with another window. Here it is the same model with the same
  # `num_ctx`; a smaller one is better where there is room, and so is a small hosted model. Leave
  # chat.fast out and chat.main reads the messages.
  - role: chat.fast
    provider: ollama
    model: llama3.1:8b-instruct-q4_K_M
    base_url: http://localhost:11434
    options:
      max_input_tokens: 8192
      num_ctx: 8704

  - role: embedding
    provider: ollama
    model: nomic-embed-text
    base_url: http://localhost:11434
    options:
      max_input_tokens: 2048

  # A hosted provider, with your own key. What you send it goes to that provider: where your data
  # goes is decided by the models you bind and by where you run Factotum, and nothing here
  # second-guesses it.
  # - role: chat.main
  #   provider: openai        # or anthropic, gemini
  #   model: gpt-4o-mini
  #   secret_ref: env:OPENAI_API_KEY

  # Any server that speaks the OpenAI API: vLLM, LM Studio, llama.cpp, OpenRouter, Groq...
  # The address is the API root, /v1 included.
  # - role: chat.main
  #   provider: openai_compatible
  #   model: qwen2.5-7b-instruct
  #   base_url: http://localhost:1234/v1
  #   options:
  #     native_structured_output: false   # most of these servers ignore a schema

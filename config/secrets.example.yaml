# The secrets that skills are given, for development, until the hub keeps them.
#
# Copy this file to config/secrets.dev.yaml (git ignores it), put real values in it, and point the
# actions service at it with FACTOTUM_ACTIONS_SECRETS_FILE. It is not read outside development.
#
# A skill declares the secrets it needs by name in its SKILL.md (`permissions: {secrets: [HA_TOKEN]}`)
# and an administrator grants them when the version is enabled. What it is given when it runs is the
# value below, under the same name, in its environment, and only that:
#
#   tenant   the secrets of the household: what the skills that belong to the household are given
#            (a Home Assistant token, the password of the router)
#   user     the secrets of the development user: what the skills that belong to that user are given
#
# A skill is only ever given the secrets of its own owner. A skill that a person wrote for themselves
# that asks for HA_TOKEN is not given the household's: it is given theirs, or it does not run.
#
# Values are text: put them in quotes, so that a token of digits is not read as a number. A name
# cannot be one that the runner sets itself or that changes how a program starts (PATH, HOME,
# HTTPS_PROXY, anything that begins with PYTHON, LD_ or FACTOTUM_).

tenant:
  HA_TOKEN: "a-long-lived-access-token-of-home-assistant"
  ROUTER_PASSWORD: "the-admin-password-of-the-router"

user:
  # HA_TOKEN: "a token that is only mine"

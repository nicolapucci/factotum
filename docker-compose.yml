name: factotum

# The on-premise deployment (a single tenant). Services are added as they are built.
# Copy .env.example to .env before starting: there is deliberately no default database password.

services:
  postgres:
    # Postgres with the pgvector extension. Pinned to an exact version: upgrades are deliberate.
    image: pgvector/pgvector:0.8.6-pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${FACTOTUM_POSTGRES_USER:-factotum}
      POSTGRES_PASSWORD: ${FACTOTUM_POSTGRES_PASSWORD:?set FACTOTUM_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${FACTOTUM_POSTGRES_DB:-factotum}
    # Docker gives a container 64 MB of shared memory, which Postgres uses for parallel queries and
    # builds: a larger collection would run out of it.
    shm_size: 256mb
    ports:
      # Loopback only: reachable from this machine for development, never from the network.
      - "127.0.0.1:${FACTOTUM_POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images keep the data under /var/lib/postgresql/18/docker and declare
      # /var/lib/postgresql as the volume, so that is where the named volume goes.
      - postgres_data:/var/lib/postgresql
      # Runs once, when the database is first created.
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  model-gateway:
    # Not started by a plain `docker compose up`: it needs the "services" profile, and until the hub
    # issues real credentials it only runs with FACTOTUM_ENVIRONMENT=development.
    profiles: ["services"]
    build:
      context: .
      dockerfile: services/model_gateway/Dockerfile
    restart: unless-stopped
    environment:
      FACTOTUM_ENVIRONMENT: ${FACTOTUM_ENVIRONMENT:-production}
      FACTOTUM_TENANT_MODE: ${FACTOTUM_TENANT_MODE:-single_tenant}
      FACTOTUM_LOG_LEVEL: ${FACTOTUM_LOG_LEVEL:-INFO}
      FACTOTUM_LOG_JSON: ${FACTOTUM_LOG_JSON:-true}
      FACTOTUM_GATEWAY_BINDINGS_FILE: /etc/factotum/bindings.dev.yaml
      # Keys reach the container only through the environment, and only the ones named here.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./config:/etc/factotum:ro
    extra_hosts:
      # A model on the host (Ollama, LM Studio) is reachable as host.docker.internal.
      - "host.docker.internal:host-gateway"
    ports:
      # Loopback only, for development. Services reach it by name on the compose network.
      - "127.0.0.1:${FACTOTUM_GATEWAY_PORT:-8081}:8081"

  knowledge:
    # Documents in, passages out. Like the gateway it is not started by a plain `docker compose up`:
    # it needs the "services" profile, and until the hub issues real credentials it only runs with
    # FACTOTUM_ENVIRONMENT=development.
    profiles: ["services"]
    build:
      context: .
      dockerfile: services/knowledge/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FACTOTUM_ENVIRONMENT: ${FACTOTUM_ENVIRONMENT:-production}
      FACTOTUM_TENANT_MODE: ${FACTOTUM_TENANT_MODE:-single_tenant}
      FACTOTUM_LOG_LEVEL: ${FACTOTUM_LOG_LEVEL:-INFO}
      FACTOTUM_LOG_JSON: ${FACTOTUM_LOG_JSON:-true}
      # The database of this deployment, by its name on the compose network.
      FACTOTUM_POSTGRES_HOST: postgres
      FACTOTUM_POSTGRES_USER: ${FACTOTUM_POSTGRES_USER:-factotum}
      FACTOTUM_POSTGRES_PASSWORD: ${FACTOTUM_POSTGRES_PASSWORD:?set FACTOTUM_POSTGRES_PASSWORD in .env}
      FACTOTUM_POSTGRES_DB: ${FACTOTUM_POSTGRES_DB:-factotum}
      # It never knows a model or a key: every embedding is asked of the gateway.
      FACTOTUM_KNOWLEDGE_GATEWAY_URL: http://model-gateway:8081
      FACTOTUM_KNOWLEDGE_MAX_UPLOAD_MB: ${FACTOTUM_KNOWLEDGE_MAX_UPLOAD_MB:-25}
      FACTOTUM_KNOWLEDGE_WORKERS: ${FACTOTUM_KNOWLEDGE_WORKERS:-2}
      FACTOTUM_KNOWLEDGE_CHILD_TOKENS: ${FACTOTUM_KNOWLEDGE_CHILD_TOKENS:-320}
      FACTOTUM_KNOWLEDGE_PARENT_TOKENS: ${FACTOTUM_KNOWLEDGE_PARENT_TOKENS:-1200}
      FACTOTUM_KNOWLEDGE_EMBED_BATCH: ${FACTOTUM_KNOWLEDGE_EMBED_BATCH:-32}
      FACTOTUM_KNOWLEDGE_INDEX_THRESHOLD: ${FACTOTUM_KNOWLEDGE_INDEX_THRESHOLD:-2000}
    ports:
      # Loopback only, for development. Services reach it by name on the compose network.
      - "127.0.0.1:${FACTOTUM_KNOWLEDGE_PORT:-8082}:8082"

  conversation:
    # A message in, an answer streamed out. Like the others it is not started by a plain
    # `docker compose up`: it needs the "services" profile, and until the hub issues real credentials
    # it only runs with FACTOTUM_ENVIRONMENT=development.
    profiles: ["services"]
    build:
      context: .
      dockerfile: services/conversation/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # It asks the actions service, before the documents, whether a message asks for something
      # to be done. It does not need it: without it every message is a question, and it says so.
      actions:
        condition: service_healthy
        required: false
    environment:
      FACTOTUM_ENVIRONMENT: ${FACTOTUM_ENVIRONMENT:-production}
      FACTOTUM_TENANT_MODE: ${FACTOTUM_TENANT_MODE:-single_tenant}
      FACTOTUM_LOG_LEVEL: ${FACTOTUM_LOG_LEVEL:-INFO}
      FACTOTUM_LOG_JSON: ${FACTOTUM_LOG_JSON:-true}
      # The database of this deployment, by its name on the compose network.
      FACTOTUM_POSTGRES_HOST: postgres
      FACTOTUM_POSTGRES_USER: ${FACTOTUM_POSTGRES_USER:-factotum}
      FACTOTUM_POSTGRES_PASSWORD: ${FACTOTUM_POSTGRES_PASSWORD:?set FACTOTUM_POSTGRES_PASSWORD in .env}
      FACTOTUM_POSTGRES_DB: ${FACTOTUM_POSTGRES_DB:-factotum}
      # It never knows a model or a key (the gateway is asked for every answer and embedding), and
      # it never reads a document (the knowledge service is asked for the passages).
      FACTOTUM_CONVERSATION_GATEWAY_URL: http://model-gateway:8081
      FACTOTUM_CONVERSATION_KNOWLEDGE_URL: http://knowledge:8082
      FACTOTUM_CONVERSATION_TIMEZONE: ${FACTOTUM_CONVERSATION_TIMEZONE:-UTC}
      FACTOTUM_CONVERSATION_SESSION_MINUTES: ${FACTOTUM_CONVERSATION_SESSION_MINUTES:-30}
      FACTOTUM_CONVERSATION_SHARED_WINDOW_SECONDS: ${FACTOTUM_CONVERSATION_SHARED_WINDOW_SECONDS:-60}
      FACTOTUM_CONVERSATION_RECENT_EXCHANGES: ${FACTOTUM_CONVERSATION_RECENT_EXCHANGES:-3}
      FACTOTUM_CONVERSATION_HISTORY_HITS: ${FACTOTUM_CONVERSATION_HISTORY_HITS:-3}
      FACTOTUM_CONVERSATION_DOCUMENT_PASSAGES: ${FACTOTUM_CONVERSATION_DOCUMENT_PASSAGES:-6}
      FACTOTUM_CONVERSATION_HISTORY_MIN_SIMILARITY: ${FACTOTUM_CONVERSATION_HISTORY_MIN_SIMILARITY:-0.5}
      FACTOTUM_CONVERSATION_RETENTION_DAYS: ${FACTOTUM_CONVERSATION_RETENTION_DAYS:-0}
      FACTOTUM_CONVERSATION_ACTIONS_URL: http://actions:8085
    ports:
      # Loopback only, for development. Services reach it by name on the compose network.
      - "127.0.0.1:${FACTOTUM_CONVERSATION_PORT:-8083}:8083"

  edge:
    # The door of the system devices: they connect to it over a WebSocket. Like the others it is not
    # started by a plain `docker compose up`: it needs the "services" profile, and until the hub
    # registers devices it reads them from config/devices.dev.yaml (copy config/devices.example.yaml)
    # and only runs with FACTOTUM_ENVIRONMENT=development.
    profiles: ["services"]
    build:
      context: .
      dockerfile: services/edge/Dockerfile
    restart: unless-stopped
    depends_on:
      conversation:
        condition: service_healthy
    environment:
      FACTOTUM_ENVIRONMENT: ${FACTOTUM_ENVIRONMENT:-production}
      FACTOTUM_TENANT_MODE: ${FACTOTUM_TENANT_MODE:-single_tenant}
      FACTOTUM_LOG_LEVEL: ${FACTOTUM_LOG_LEVEL:-INFO}
      FACTOTUM_LOG_JSON: ${FACTOTUM_LOG_JSON:-true}
      # It asks the conversation service for every answer and knows nothing else: no database, no
      # model, no key, no document.
      FACTOTUM_EDGE_CONVERSATION_URL: http://conversation:8083
      FACTOTUM_EDGE_DEVICES_FILE: /etc/factotum/devices.dev.yaml
      FACTOTUM_EDGE_HELLO_TIMEOUT_S: ${FACTOTUM_EDGE_HELLO_TIMEOUT_S:-10}
      FACTOTUM_EDGE_HEARTBEAT_S: ${FACTOTUM_EDGE_HEARTBEAT_S:-20}
      FACTOTUM_EDGE_IDLE_TIMEOUT_S: ${FACTOTUM_EDGE_IDLE_TIMEOUT_S:-60}
      FACTOTUM_EDGE_COMMAND_TIMEOUT_S: ${FACTOTUM_EDGE_COMMAND_TIMEOUT_S:-10}
      FACTOTUM_EDGE_TURN_TIMEOUT_S: ${FACTOTUM_EDGE_TURN_TIMEOUT_S:-130}
      FACTOTUM_EDGE_SEND_TIMEOUT_S: ${FACTOTUM_EDGE_SEND_TIMEOUT_S:-10}
    volumes:
      - ./config:/etc/factotum:ro
    ports:
      # Loopback only, for development. Services reach it by name on the compose network; devices
      # elsewhere on the network will reach it through what the deployment puts in front of it.
      - "127.0.0.1:${FACTOTUM_EDGE_PORT:-8084}:8084"

  actions:
    # What a message asks to be done: it chooses the skill, decides whether it may run, asks for a
    # yes when it must, and audits it. Like the others it is not started by a plain
    # `docker compose up`: it needs the "services" profile, and until the hub registers devices and
    # keeps secrets it reads them from config/devices.dev.yaml and config/secrets.dev.yaml (copy the
    # example files) and only runs with FACTOTUM_ENVIRONMENT=development. It runs the script of a
    # skill in the runner and has a device do what it answers with through the edge; it is given
    # neither an engine nor a device connection itself.
    profiles: ["services"]
    build:
      context: .
      dockerfile: services/actions/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # It does not need the runner to start: without it a skill fails, and says so. (Not the edge:
      # the edge waits for the conversation service, which asks this one.)
      runner:
        condition: service_healthy
        required: false
    environment:
      FACTOTUM_ENVIRONMENT: ${FACTOTUM_ENVIRONMENT:-production}
      FACTOTUM_TENANT_MODE: ${FACTOTUM_TENANT_MODE:-single_tenant}
      FACTOTUM_LOG_LEVEL: ${FACTOTUM_LOG_LEVEL:-INFO}
      FACTOTUM_LOG_JSON: ${FACTOTUM_LOG_JSON:-true}
      # The database of this deployment, by its name on the compose network.
      FACTOTUM_POSTGRES_HOST: postgres
      FACTOTUM_POSTGRES_USER: ${FACTOTUM_POSTGRES_USER:-factotum}
      FACTOTUM_POSTGRES_PASSWORD: ${FACTOTUM_POSTGRES_PASSWORD:?set FACTOTUM_POSTGRES_PASSWORD in .env}
      FACTOTUM_POSTGRES_DB: ${FACTOTUM_POSTGRES_DB:-factotum}
      # It never knows a model or a key: the gateway is asked to read every message and to embed
      # every skill. A script runs in the runner, and a command reaches a device through the edge.
      FACTOTUM_ACTIONS_GATEWAY_URL: http://model-gateway:8081
      FACTOTUM_ACTIONS_RUNNER_URL: http://runner:8086
      FACTOTUM_ACTIONS_EDGE_URL: http://edge:8084
      FACTOTUM_ACTIONS_DEVICES_FILE: /etc/factotum/devices.dev.yaml
      FACTOTUM_ACTIONS_SECRETS_FILE: /etc/factotum/secrets.dev.yaml
      FACTOTUM_ACTIONS_SKILLS_DIR: /skills
      FACTOTUM_ACTIONS_ENABLE_SKILLS_DIR: ${FACTOTUM_ACTIONS_ENABLE_SKILLS_DIR:-false}
      FACTOTUM_ACTIONS_MATCH_THRESHOLD: ${FACTOTUM_ACTIONS_MATCH_THRESHOLD:-0.45}
      FACTOTUM_ACTIONS_MATCH_CANDIDATES: ${FACTOTUM_ACTIONS_MATCH_CANDIDATES:-6}
      FACTOTUM_ACTIONS_MATCH_TIMEOUT_S: ${FACTOTUM_ACTIONS_MATCH_TIMEOUT_S:-4}
      FACTOTUM_ACTIONS_INDEX_TIMEOUT_S: ${FACTOTUM_ACTIONS_INDEX_TIMEOUT_S:-8}
      FACTOTUM_ACTIONS_PLANNER_TIMEOUT_S: ${FACTOTUM_ACTIONS_PLANNER_TIMEOUT_S:-10}
      FACTOTUM_ACTIONS_READER_TIMEOUT_S: ${FACTOTUM_ACTIONS_READER_TIMEOUT_S:-6}
      FACTOTUM_ACTIONS_CONFIRMATION_SECONDS: ${FACTOTUM_ACTIONS_CONFIRMATION_SECONDS:-60}
      FACTOTUM_ACTIONS_APPROVAL_WAIT_S: ${FACTOTUM_ACTIONS_APPROVAL_WAIT_S:-20}
      FACTOTUM_ACTIONS_APPROVAL_MINUTES: ${FACTOTUM_ACTIONS_APPROVAL_MINUTES:-10}
      FACTOTUM_ACTIONS_RUN_MARGIN_S: ${FACTOTUM_ACTIONS_RUN_MARGIN_S:-5}
      FACTOTUM_ACTIONS_EDGE_TIMEOUT_S: ${FACTOTUM_ACTIONS_EDGE_TIMEOUT_S:-15}
      FACTOTUM_ACTIONS_MAX_DEVICES_SHOWN: ${FACTOTUM_ACTIONS_MAX_DEVICES_SHOWN:-10}
    volumes:
      - ./config:/etc/factotum:ro
      - ./skills:/skills:ro
    ports:
      # Loopback only, for development. Services reach it by name on the compose network.
      - "127.0.0.1:${FACTOTUM_ACTIONS_PORT:-8085}:8085"

  egress:
    # The only way out of the sandbox of a skill. A container that runs a script is on a network with
    # nothing on it but this proxy, which lets it reach the hosts its grant lists and nothing else.
    # It is on the sandbox network to be reached, and on a network of its own to get out: nothing
    # else of the deployment (the database, the other services) is on that one, so a script cannot
    # reach them through it. Like the others it needs the "services" profile.
    profiles: ["services"]
    build:
      context: .
      dockerfile: services/egress/Dockerfile
    restart: unless-stopped
    networks:
      - sandbox
      - egress
    environment:
      FACTOTUM_ENVIRONMENT: ${FACTOTUM_ENVIRONMENT:-production}
      FACTOTUM_TENANT_MODE: ${FACTOTUM_TENANT_MODE:-single_tenant}
      FACTOTUM_LOG_LEVEL: ${FACTOTUM_LOG_LEVEL:-INFO}
      FACTOTUM_LOG_JSON: ${FACTOTUM_LOG_JSON:-true}
      # The key that grants are signed with: the runner has it, and nothing else. There is no
      # default and no placeholder: without one from .env (32 characters or more) it does not start,
      # and says so, which is all that stops the rest of the deployment from being asked to.
      FACTOTUM_EGRESS_KEY: ${FACTOTUM_EGRESS_KEY:-}
      FACTOTUM_EGRESS_CONNECT_PORTS: ${FACTOTUM_EGRESS_CONNECT_PORTS:-443}
      FACTOTUM_EGRESS_MAX_CONNECTIONS: ${FACTOTUM_EGRESS_MAX_CONNECTIONS:-64}
      FACTOTUM_EGRESS_HEADER_TIMEOUT_S: ${FACTOTUM_EGRESS_HEADER_TIMEOUT_S:-10}
      FACTOTUM_EGRESS_CONNECT_TIMEOUT_S: ${FACTOTUM_EGRESS_CONNECT_TIMEOUT_S:-10}
      FACTOTUM_EGRESS_IDLE_TIMEOUT_S: ${FACTOTUM_EGRESS_IDLE_TIMEOUT_S:-30}
      FACTOTUM_EGRESS_MAX_DURATION_S: ${FACTOTUM_EGRESS_MAX_DURATION_S:-130}
      FACTOTUM_EGRESS_MAX_MB: ${FACTOTUM_EGRESS_MAX_MB:-20}
    # It needs nothing from the system: no capability, nothing to write to.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    extra_hosts:
      # A device or a service on this machine is reachable as host.docker.internal, when a skill
      # names it (a private address is only reached by a host that is named as it is).
      - "host.docker.internal:host-gateway"

  sandbox-image:
    # Makes sure the image that scripts run in is on the engine (the runner never pulls it), and
    # does nothing else: it ends at once.
    profiles: ["services"]
    image: ${FACTOTUM_RUNNER_IMAGE:-python:3.13-slim}
    entrypoint: ["true"]
    restart: "no"

  runner:
    # Runs the script of a skill in a container of its own, made for the run and thrown away after
    # it. It is the only service that is given the socket of the engine to make them with, which is
    # as much as being root on this machine: the reason it does nothing but run jobs, and cannot be
    # told what a container is like (see docs/runner.md). Like the others it needs the "services"
    # profile, and until the hub issues real credentials it only runs with
    # FACTOTUM_ENVIRONMENT=development.
    profiles: ["services"]
    build:
      context: .
      dockerfile: services/runner/Dockerfile
    restart: unless-stopped
    depends_on:
      egress:
        condition: service_healthy
      sandbox-image:
        condition: service_completed_successfully
    # The socket belongs to a group of the engine's, and the runner does not run as root: this is
    # that group (`stat -c %g /var/run/docker.sock`, 0 on Docker Desktop).
    group_add: ["${FACTOTUM_DOCKER_GID:-0}"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
    environment:
      FACTOTUM_ENVIRONMENT: ${FACTOTUM_ENVIRONMENT:-production}
      FACTOTUM_TENANT_MODE: ${FACTOTUM_TENANT_MODE:-single_tenant}
      FACTOTUM_LOG_LEVEL: ${FACTOTUM_LOG_LEVEL:-INFO}
      FACTOTUM_LOG_JSON: ${FACTOTUM_LOG_JSON:-true}
      FACTOTUM_RUNNER_DOCKER_HOST: unix:///var/run/docker.sock
      FACTOTUM_RUNNER_IMAGE: ${FACTOTUM_RUNNER_IMAGE:-python:3.13-slim}
      # What a script that was granted hosts is given to go out through: the proxy, by its name on
      # the network of the sandboxes, and the key its grants are signed with.
      FACTOTUM_RUNNER_NETWORK: factotum-sandbox
      FACTOTUM_RUNNER_EGRESS_URL: http://egress:3128
      FACTOTUM_RUNNER_EGRESS_KEY: ${FACTOTUM_EGRESS_KEY:-}
      FACTOTUM_RUNNER_UID: ${FACTOTUM_RUNNER_UID:-10002}
      FACTOTUM_RUNNER_MEMORY_MB: ${FACTOTUM_RUNNER_MEMORY_MB:-128}
      FACTOTUM_RUNNER_CPUS: ${FACTOTUM_RUNNER_CPUS:-0.5}
      FACTOTUM_RUNNER_PIDS: ${FACTOTUM_RUNNER_PIDS:-64}
      FACTOTUM_RUNNER_TMP_MB: ${FACTOTUM_RUNNER_TMP_MB:-16}
      FACTOTUM_RUNNER_LOG_KB: ${FACTOTUM_RUNNER_LOG_KB:-256}
      FACTOTUM_RUNNER_MAX_CONCURRENCY: ${FACTOTUM_RUNNER_MAX_CONCURRENCY:-4}
      FACTOTUM_RUNNER_QUEUE_WAIT_S: ${FACTOTUM_RUNNER_QUEUE_WAIT_S:-5}
      FACTOTUM_RUNNER_GRACE_S: ${FACTOTUM_RUNNER_GRACE_S:-10}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      # Loopback only, for development. Services reach it by name on the compose network.
      - "127.0.0.1:${FACTOTUM_RUNNER_PORT:-8086}:8086"

networks:
  sandbox:
    # Where a script runs. Nothing is on it but the egress proxy, and it has no way out of its own:
    # a container on it can reach the proxy and nothing else. Named, because the runner finds it by
    # name when it makes a container.
    name: factotum-sandbox
    internal: true
  egress:
    # What the egress proxy goes out through, and nothing else is on it.

volumes:
  postgres_data:
